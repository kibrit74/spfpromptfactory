<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPF Prompt Factory App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface2: #1a1a1a;
      --border: #2a2a2a;
      --accent: #7C3AED;
      --accent-hover: #6D28D9;
      --text-primary: #ffffff;
      --text-secondary: #888888;
      --icon-bg: #1e1e2e;
      --error: #ef4444;
      --success: #22c55e;
      --glow: rgba(124, 58, 237, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text-primary);
      font-family: Inter, system-ui, sans-serif;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      z-index: -2;
      background:
        radial-gradient(circle at 18% 14%, rgba(124, 58, 237, 0.14), transparent 30%),
        radial-gradient(circle at 82% 18%, rgba(109, 40, 217, 0.12), transparent 30%),
        radial-gradient(circle at 50% 88%, rgba(124, 58, 237, 0.08), transparent 24%);
      animation: meshDrift 8s ease-in-out infinite alternate;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(10, 10, 10, 0.3), var(--bg));
      pointer-events: none;
    }

    @keyframes meshDrift {
      from { transform: translate3d(-1%, -1%, 0) scale(1); }
      to { transform: translate3d(1%, 1%, 0) scale(1.04); }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    textarea {
      font: inherit;
    }

    .navbar {
      position: fixed;
      inset: 0 0 auto;
      z-index: 1000;
      transition: transform 0.3s ease, background 0.2s ease, border-color 0.2s ease;
      border-bottom: 1px solid transparent;
    }

    .navbar.scrolled {
      background: rgba(10, 10, 10, 0.68);
      backdrop-filter: blur(16px);
      border-bottom-color: var(--border);
    }

    .navbar.hidden {
      transform: translateY(-100%);
    }

    .nav-inner {
      width: min(100% - 40px, 1180px);
      min-height: 76px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 18px;
      letter-spacing: -0.03em;
    }

    .brand-icon,
    .small-icon {
      display: grid;
      place-items: center;
      background: var(--icon-bg);
      border: 1px solid var(--border);
      color: var(--accent);
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
    }

    .brand-strong {
      color: var(--accent);
      font-weight: 800;
    }

    .brand-regular {
      color: var(--text-primary);
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 700;
    }

    .nav-links a {
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      color: var(--text-primary);
      font-weight: 800;
      cursor: pointer;
      overflow: hidden;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 -130%;
      width: 90%;
      z-index: -1;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
      transform: skewX(-18deg);
      transition: left 0.5s ease;
    }

    .btn:hover::before {
      left: 135%;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--accent);
      box-shadow: 0 18px 45px rgba(124, 58, 237, 0.22);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-ghost {
      background: rgba(255,255,255,0.03);
      border-color: var(--border);
    }

    .menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface2);
      color: var(--text-primary);
      cursor: pointer;
    }

    .mobile-menu {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
      place-items: center;
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(18px);
    }

    .mobile-menu.open {
      display: grid;
    }

    .mobile-menu nav {
      display: grid;
      gap: 22px;
      text-align: center;
      font: 800 32px "Space Grotesk", sans-serif;
    }

    .app-shell {
      width: min(100% - 40px, 1080px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 128px 0 64px;
      display: grid;
      align-items: center;
    }

    .hero-copy {
      text-align: center;
      margin: 0 auto 30px;
      max-width: 760px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 13px;
      border-radius: 999px;
      border: 1px solid rgba(124, 58, 237, 0.42);
      background: rgba(124, 58, 237, 0.08);
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
    }

    h1 {
      margin-top: 22px;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(42px, 6vw, 68px);
      letter-spacing: -0.04em;
      line-height: 1.03;
      color: var(--text-primary);
    }

    .subtitle {
      margin: 18px auto 0;
      color: var(--text-secondary);
      font-size: 18px;
      line-height: 1.7;
      max-width: 620px;
    }

    .factory-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
      gap: 20px;
      align-items: stretch;
    }

    .card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 28px 80px rgba(0,0,0,0.28);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .card:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(124,58,237,0.22), 0 28px 80px rgba(0,0,0,0.28);
    }

    .card:hover {
      border-color: rgba(124,58,237,0.55);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label,
    .output-title {
      color: var(--text-secondary);
      font: 700 12px "JetBrains Mono", Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      min-height: 250px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      color: var(--text-primary);
      font-size: 15px;
      line-height: 1.65;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea::placeholder {
      color: #5f5f5f;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(124,58,237,0.26);
    }

    textarea[readonly] {
      min-height: 360px;
      background: #080808;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 13px;
      color: #e8e8e8;
    }

    #generateBtn {
      width: 100%;
      margin-top: 18px;
      border: 0;
    }

    #generateBtn:disabled {
      opacity: 0.72;
      cursor: wait;
      transform: none;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.28);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #errorMsg {
      min-height: 22px;
      margin-top: 10px;
      color: var(--error);
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .output-section {
      display: none;
      flex-direction: column;
      gap: 14px;
      opacity: 0;
      transform: translateY(16px);
      animation: outputIn 0.35s ease forwards;
    }

    @keyframes outputIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .copy-btn {
      width: auto;
      min-height: 38px;
      padding: 0 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .copy-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(124,58,237,0.08);
    }

    @media (max-width: 900px) {
      .factory-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .nav-links,
      .nav-actions {
        display: none;
      }

      .menu-toggle {
        display: inline-flex;
      }

      .app-shell {
        width: min(100% - 28px, 1080px);
        padding-top: 112px;
      }

      .card {
        padding: 18px;
      }

      textarea,
      textarea[readonly] {
        min-height: 220px;
      }
    }
  </style>
</head>
<body>
  <header class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="/" class="brand" aria-label="SPF Prompt Factory">
        <span class="brand-icon"><i data-lucide="factory"></i></span>
        <span><span class="brand-strong">SPF</span> <span class="brand-regular">Prompt Factory</span></span>
      </a>
      <nav class="nav-links" aria-label="Ana menü">
        <a href="/#how-it-works">Nasıl Çalışır</a>
        <a href="/#features">Özellikler</a>
        <a href="/#pricing">Fiyatlandırma</a>
      </nav>
      <div class="nav-actions">
        <a href="/" class="btn btn-ghost">Landing Page</a>
        <a href="#taskInput" class="btn btn-primary">Ücretsiz Dene</a>
      </div>
      <button class="menu-toggle" id="menuToggle" aria-label="Menüyü aç">
        <i data-lucide="menu"></i>
      </button>
    </div>
  </header>

  <div class="mobile-menu" id="mobileMenu">
    <nav>
      <a href="/#how-it-works">Nasıl Çalışır</a>
      <a href="/#features">Özellikler</a>
      <a href="/#pricing">Fiyatlandırma</a>
      <a href="/">Landing Page</a>
    </nav>
  </div>

  <main class="app-shell">
    <section class="hero-copy">
      <div class="badge"><i data-lucide="zap"></i> AI-Powered Prompt Generator</div>
      <h1>Görevinizi Tanımlayın</h1>
      <p class="subtitle">Derdini anlat, sistem nokta atışı SPF prompt üretsin.</p>
    </section>

    <section class="factory-grid" aria-label="SPF prompt üretici">
      <div class="card">
        <div class="form-group">
          <label for="taskInput">Görev</label>
          <textarea id="taskInput" rows="10" placeholder="Örn: Müşteri şikayetleri excelimi analiz edip HTML dashboard çıkar..."></textarea>
        </div>
        <button id="generateBtn" class="btn btn-primary">Prompt Üret <i data-lucide="sparkles"></i></button>
        <div id="errorMsg"></div>
      </div>

      <div class="card output-section" id="outputSection">
        <div class="output-header">
          <div class="output-title">Üretilen SPF Prompt</div>
          <button id="copyBtn" class="copy-btn"><i data-lucide="copy"></i> Kopyala</button>
        </div>
        <textarea id="promptOutput" rows="15" readonly></textarea>
      </div>
    </section>
  </main>

  <script>
    const generateBtn = document.getElementById('generateBtn');
    const taskInput = document.getElementById('taskInput');
    const outputSection = document.getElementById('outputSection');
    const promptOutput = document.getElementById('promptOutput');
    const errorMsg = document.getElementById('errorMsg');
    const copyBtn = document.getElementById('copyBtn');
    const navbar = document.getElementById('navbar');
    const menuToggle = document.getElementById('menuToggle');
    const mobileMenu = document.getElementById('mobileMenu');

    let loadingInterval;
    let lastScrollY = window.scrollY;

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });

    window.addEventListener('scroll', () => {
      const current = window.scrollY;
      navbar.classList.toggle('scrolled', current > 50);
      navbar.classList.toggle('hidden', current > lastScrollY && current > 160);
      lastScrollY = current;
    }, { passive: true });

    function setMobileMenu(open) {
      mobileMenu.classList.toggle('open', open);
      document.body.classList.toggle('menu-open', open);
      menuToggle.innerHTML = open ? '<i data-lucide="x"></i>' : '<i data-lucide="menu"></i>';
      lucide.createIcons();
    }

    menuToggle.addEventListener('click', () => {
      setMobileMenu(!mobileMenu.classList.contains('open'));
    });

    mobileMenu.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', () => setMobileMenu(false));
    });

    function setLoading(isLoading) {
      if (isLoading) {
        generateBtn.disabled = true;
        generateBtn.innerHTML = '<span class="spinner"></span> Üretiliyor...';
        loadingInterval = setInterval(() => {}, 500);
      } else {
        generateBtn.disabled = false;
        clearInterval(loadingInterval);
        generateBtn.innerHTML = 'Prompt Üret <i data-lucide="sparkles"></i>';
        lucide.createIcons();
      }
    }

    generateBtn.addEventListener('click', async () => {
      const task = taskInput.value.trim();
      if (!task) return;

      errorMsg.innerText = '';
      outputSection.style.display = 'none';
      setLoading(true);

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ task })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Bilinmeyen bir hata oluştu');
        }

        promptOutput.value = data.prompt;
        outputSection.style.display = 'flex';
      } catch (err) {
        errorMsg.innerText = err.message;
      } finally {
        setLoading(false);
      }
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(promptOutput.value);
        copyBtn.innerHTML = '<i data-lucide="check"></i> Kopyalandı';
        lucide.createIcons();
        setTimeout(() => {
          copyBtn.innerHTML = '<i data-lucide="copy"></i> Kopyala';
          lucide.createIcons();
        }, 2000);
      } catch (err) {
        console.error('Kopyalama hatası:', err);
      }
    });
  </script>
</body>
</html>
